<footer class="footer">
  <div class="container footer__container">
    <div class="footer__top">
      <img
        class="footer__logo"
        src="img/logo-footer.png"
        alt="logo text your energy"
      />
      <div class="footer__socials">
        <load src="partials/socials.html" />
      </div>
    </div>
    <div class="footer__central">
      <h2 class="footer__header">
        Transforming your <i>body</i> shape with us
      </h2>
      <form class="footer__subscribe" action="#">
        <p class="footer__subscribe-p">
          Subscribe and learn about new exercises!
        </p>
        <input
          class="footer__subscribe-element footer__subscribe-email"
          type="email"
          placeholder="Email"
          pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
          required
        />
        <button
          class="footer__subscribe-element footer__subscribe-btn"
          type="submit"
        >
          Send
        </button>
      </form>
    </div>
    <div class="footer__legals">
      <p class="footer__rights">
        <a href="#">Your Energy. All rights reserved.</a>
      </p>
      <p class="footer__policy">
        <a href="#">Privacy Policy / Terms of Service</a>
      </p>
      <p class="footer__year">©2023</p>
    </div>
  </div>
</footer>
