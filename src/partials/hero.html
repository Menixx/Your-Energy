<section class="hero">
  <div class="hero__container">
    <div class="hero__header">
      <h1 class="hero__header-h1">
        Get <i>Body</i> in<br />
        shape, Stay healthy
      </h1>
    </div>
    <p class="hero__p">
      Transform your physique and embrace a healthier lifestyle with our
      comprehensive fitness and nutrition support.
    </p>
    <picture class="hero__image">
      <source
        media="(min-width: 1440px)"
        srcset="
          img/hero-image-desktop.webp    1x,
          img/hero-image-desktop@2x.webp 2x
        "
      />
      <source
        media="(min-width: 768px)"
        srcset="img/hero-image-tablet.webp 1x, img/hero-image-tablet@2x.webp 2x"
      />
      <img
        src="img/hero-image-mobile.webp"
        srcset="img/hero-image-mobile.webp 1x, img/hero-image-mobile@2x.webp 2x"
        alt="Image showing two women doing sport"
      />
    </picture>

    <img
      class="hero__image-mini"
      src="img/hero-image-mini.png"
      srcset="img/hero-image-mini.png 1x, img/hero-image-mini@2x.png 2x"
      alt="An image presenting to women doing sport"
    />
    <ul class="hero__hashtags">
      <li class="hero__hashtag-item">#Sport</li>
      <li class="hero__hashtag-item">#Healthy</li>
      <li class="hero__hashtag-item">#Workout</li>
      <li class="hero__hashtag-item">#Diet</li>
    </ul>
  </div>
</section>
